services:
  tinybite-api:
    image: tinybite-server:latest
    container_name: tinybite-api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"  # MySQL(호스트) 접근용
    networks:
      - tinybite-net
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:1.27.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/tinybite/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /home/ubuntu/tinybite/data/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/tinybite/data/certbot/www:/var/www/certbot
    restart: always
    networks:
      - tinybite-net
    depends_on:
      - tinybite-api

  redis:
    container_name: redis
    image: redis:7.2.4
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - tinybite-net
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - /home/ubuntu/tinybite/data/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/tinybite/data/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  redis_data:

networks:
  tinybite-net:
    driver: bridge